name: Deploy Docusaurus to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build
        env:
          BASE_URL: /dot-ring-doc/
          SITE_URL: https://chainscore.github.io

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: dot-ring-doc-pages
          path: build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: dot-ring-doc-pages

    # Notes:
    # 1. Ensure you have enabled GitHub Pages in repo settings -> Pages -> Source: GitHub Actions.
    # 2. Update docusaurus.config.js url and baseUrl for correct asset paths.
