name: Deploy docs to Azure Static Web Apps

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  build-and-deploy:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Build and deploy DotRing docs
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build documentation
        run: npm run build
        env:
          BASE_URL: /
          SITE_URL: https://dotring.chainscore.finance

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_NEW_ACCOUNT }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: build
          api_location: ''
          output_location: ''
          skip_app_build: true

      - name: Verify production host
        if: github.event_name != 'pull_request'
        run: |
          curl --fail --location --silent --show-error \
            --retry 18 --retry-delay 10 --retry-all-errors \
            https://gray-pebble-0dd5b6203.7.azurestaticapps.net/ > /dev/null

  close-pull-request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close pull request environment
    steps:
      - name: Close Azure Static Web Apps environment
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_NEW_ACCOUNT }}
          action: close

