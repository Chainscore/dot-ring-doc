<?xml version="1.0" encoding="UTF-8"?>
<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">DotRing Logo (dark)</title>
  <desc id="logoDesc">A pink core dot with a white inner ring and soft dark stroke for dark backgrounds.</desc>
  <defs>
    <linearGradient id="pinkGradDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6ecf"/>
      <stop offset="1" stop-color="#ff1aa6"/>
    </linearGradient>
    <filter id="shadowDark" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.16"/>
    </filter>
  </defs>
  <!-- Outer ring; slightly lighter stroke for dark mode -->
  <circle cx="32" cy="32" r="30" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="3" filter="url(#shadowDark)"/>
  <!-- Inner white ring -->
  <circle cx="32" cy="32" r="20" fill="none" stroke="#ffffff" stroke-width="3"/>
  <!-- Pink core dot (brighter) -->
  <circle cx="32" cy="32" r="12" fill="url(#pinkGradDark)"/>
</svg>
