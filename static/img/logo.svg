<?xml version="1.0" encoding="UTF-8"?>
<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="logoTitle logoDesc">
  <defs>
    <linearGradient id="pinkGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff339b"/>
      <stop offset="1" stop-color="#e6007a"/>
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>
  <!-- Outer ring -->
  <circle cx="32" cy="32" r="30" fill="none" stroke="#121212" stroke-width="3" filter="url(#shadow)"/>
  <!-- Inner white ring -->
  <circle cx="32" cy="32" r="20" fill="none" stroke="#ffffff" stroke-width="3"/>
  <!-- Pink core dot -->
  <circle cx="32" cy="32" r="12" fill="url(#pinkGrad)"/>
</svg>
<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <circle cx="32" cy="32" r="30" stroke="black" stroke-width="4"/>
  <circle cx="32" cy="32" r="16" fill="#e6007a" />
</svg>
